---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
  annotations:
    flux.weave.works/automated: "false"
spec:
  chart:
    spec:
      # używamy repo OCI
      chart: oci://quay.io/jetstack/charts/cert-manager
      version: 1.18.2
  interval: 10m
  install:
    createNamespace: true
  values:
    crds:
      enabled: true
    podDnsConfig:
      nameservers:
      - "8.8.8.8"
      - "1.1.1.1"
